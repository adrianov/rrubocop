[package]
name = "rrubocop"
version = "0.7.2"
edition = "2024"
rust-version = "1.85"
authors = ["Peter Adrianov"]
license = "GPL-3.0-or-later"
repository = "https://github.com/adrianov/rrubocop"
homepage = "https://github.com/adrianov/rrubocop"
documentation = "https://github.com/adrianov/rrubocop"
description = "10x faster RuboCop drop-in. Same output format and configs, without maintaining RuboCop gems or a Ruby environment."
readme = "README.md"
keywords = ["ruby", "linter", "rubocop", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "NOTICE",
    "man/**",
]

[[bin]]
name = "rrubocop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
libc = "0.2"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
sha2 = "0.10"
redb = "4.2"
tree-sitter = "0.26"
tree-sitter-ruby = { version = "0.23.1", path = "vendor/tree-sitter-ruby" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 16
strip = true

[package.metadata.deb]
section = "utils"
priority = "optional"
maintainer = "Peter M Adrianov <peter.adrianov@gmail.com>"
copyright = "Peter M Adrianov"
license-file = ["LICENSE", "0"]
extended-description = """10x faster RuboCop drop-in written in Rust.
Same CLI, configs, and output format — no gems or Ruby environment to maintain.
Built for Ubuntu 22.04+ and Debian bookworm+ (amd64)."""
depends = "$auto"
assets = [
    ["target/release/rrubocop", "usr/bin/", "755"],
    ["man/rrubocop.1", "usr/share/man/man1/", "644"],
]
