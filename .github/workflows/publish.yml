# Publish rrubocop to crates.io and GitHub Releases when a version tag is pushed.
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  crates-io:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb --locked
      - name: Smoke-test .deb install
        run: |
          set -euo pipefail
          deb=(target/debian/*.deb)
          sudo dpkg -i "${deb[0]}"
          rrubocop --help >/dev/null
          man -w rrubocop
          dpkg -L rrubocop | grep -E '/usr/bin/rrubocop|/usr/share/man/man1/rrubocop\.1'
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: rrubocop-deb
          path: target/debian/*.deb

  tarball:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked
      - name: Package
        run: |
          set -euo pipefail
          ver=$(cargo pkgid | sed 's/.*#//')
          name="rrubocop-${ver}-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/rrubocop" "$name/"
          cp man/rrubocop.1 "$name/"
          tar -czf "${name}.tar.gz" "$name"
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: rrubocop-${{ matrix.target }}
          path: rrubocop-*.tar.gz

  release:
    needs: [deb, tarball]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
